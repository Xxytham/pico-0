<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Video | Ethan Rapoport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F2759; --navy-ink:#FFFFFF; --navy-muted:#C7CCE6;
  --bg:#FFFFFF; --surface:#F3F5F2; --ink:#1A1D2B; --muted:#565C70; --rule:#DCE0E6;
  --pcb:#1E6B45; --led-red:#E5372B; --led-yellow:#F2C230;
  --serif:"Source Serif 4", Cambria, Georgia, serif;
  --sans:"Atkinson Hyperlegible", Calibri, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#161C42; --navy-ink:#FFFFFF; --navy-muted:#B3B9D9;
    --bg:#0F1328; --surface:#181E3A; --ink:#E9EBF3; --muted:#A6ACC4; --rule:#2B3256;
    --pcb:#5BC48C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --navy:#161C42; --navy-ink:#FFFFFF; --navy-muted:#B3B9D9;
  --bg:#0F1328; --surface:#181E3A; --ink:#E9EBF3; --muted:#A6ACC4; --rule:#2B3256;
  --pcb:#5BC48C; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6}
img,video{max-width:100%;height:auto;display:block}
a{color:inherit}
a:focus-visible,video:focus-visible{outline:3px solid var(--led-yellow);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0}
p{margin:0 0 1em}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(1.25rem,4vw,2.5rem)}

.led{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 10px 2px var(--glow,transparent)}
.led.red{background:var(--led-red);--glow:rgba(229,55,43,.65)}
.led.yellow{background:var(--led-yellow);--glow:rgba(242,194,48,.6)}
.led.siren{background:linear-gradient(90deg,var(--led-red) 50%,var(--led-yellow) 50%);--glow:rgba(242,120,40,.55)}
.led.rgb{background:conic-gradient(#E5372B,#F28A1E,#F2C230,#3DBE5A,#2F7BEA,#7A3FE0,#E5372B);--glow:rgba(120,140,255,.55)}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.player{flex:1}
/* Video page */
.page-head{background:var(--navy);color:var(--navy-ink)}
.page-head .wrap{padding-top:clamp(3rem,8vw,5.5rem);padding-bottom:clamp(2rem,5vw,3rem)}
.page-head .kicker{color:var(--navy-muted);margin:0 0 .5rem}
.page-head h1{font-size:clamp(2.2rem,5vw,3.5rem);letter-spacing:-.01em}
.player{padding:clamp(2rem,6vw,4rem) 0}
.frame{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.under{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;justify-content:space-between;align-items:center;margin-top:1rem;color:var(--muted)}
.under a{color:var(--pcb);font-weight:700;text-underline-offset:3px}
/* Thank you */
.thanks{background:var(--navy);color:var(--navy-ink);text-align:center;padding:clamp(3.5rem,9vw,6rem) 0}
.thanks h2{font-size:clamp(2.4rem,6vw,4rem);margin-bottom:.75rem}
.thanks p{margin:0;color:var(--navy-muted)}
.thanks .who{color:var(--navy-ink);font-size:1.2rem;margin-bottom:.3rem}


/* Hamburger menu */
.menu-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:50;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.menu-btn:focus-visible,.menu a:focus-visible{outline:3px solid var(--led-yellow);outline-offset:3px}
.menu-btn .bars,.menu-btn .bars::before,.menu-btn .bars::after{display:block;width:20px;height:2px;border-radius:2px;background:currentColor;position:relative;transition:transform .2s,background .2s}
.menu-btn .bars::before,.menu-btn .bars::after{content:"";position:absolute;left:0}
.menu-btn .bars::before{top:-6px}.menu-btn .bars::after{top:6px}
.menu-btn[aria-expanded="true"] .bars{background:transparent}
.menu-btn[aria-expanded="true"] .bars::before{transform:translateY(6px) rotate(45deg)}
.menu-btn[aria-expanded="true"] .bars::after{transform:translateY(-6px) rotate(-45deg)}
.menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);right:14px;z-index:49;width:min(280px,calc(100vw - 28px));background:var(--navy);color:var(--navy-ink);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:.5rem;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.menu[hidden]{display:none}
.menu ul{list-style:none;margin:0;padding:0}
.menu a{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:6px;text-decoration:none;color:var(--navy-ink)}
.menu a:hover{background:rgba(255,255,255,.1)}
.menu a[aria-current="page"]{background:rgba(255,255,255,.14);font-weight:700}
.menu .sep{height:1px;background:rgba(255,255,255,.18);margin:.4rem .5rem}
.menu .led{width:12px;height:12px}
.menu .dot{width:12px;height:12px;flex:none}
@media (prefers-reduced-motion: reduce){.menu-btn .bars,.menu-btn .bars::before,.menu-btn .bars::after{transition:none}}
</style>
</head>
<body>
<button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu"><span class="bars" aria-hidden="true"></span></button>
<nav id="site-menu" class="menu" aria-label="Site" hidden>
  <ul>
    <li><a href="index.html"><span class="dot" aria-hidden="true"></span>Home</a></li>
    <li><a href="index.html#siren"><span class="led siren" aria-hidden="true"></span>Police siren</a></li>
    <li><a href="index.html#blinker"><span class="led red" aria-hidden="true"></span>LDR blinker</a></li>
    <li><a href="index.html#dimmer"><span class="led yellow" aria-hidden="true"></span>Reversed dimmer</a></li>
    <li><a href="index.html#rainbow"><span class="led rgb" aria-hidden="true"></span>RGB rainbow</a></li>
    <li><a href="index.html#gallery"><span class="dot" aria-hidden="true"></span>Gallery</a></li>
  </ul>
  <div class="sep" role="presentation"></div>
  <ul>
    <li><a href="video.html" aria-current="page"><span class="dot" aria-hidden="true"></span>Project video</a></li>
  </ul>
</nav>

<header class="page-head">
  <div class="wrap">
    <p class="kicker">Pico-0 · Ethan Rapoport</p>
    <h1>Project video</h1>
  </div>
</header>

<main class="player">
  <div class="wrap">
    <div class="frame">
      <iframe src="https://www.youtube-nocookie.com/embed/i5qnnIA4JPU?rel=0" title="Project video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <div class="under">
      <a href="index.html">← Back to the project</a>
      <a href="https://youtu.be/i5qnnIA4JPU">Watch on YouTube</a>
    </div>
  </div>
</main>

<footer class="thanks">
  <div class="wrap">
    <h2>Thank You</h2>
    <p class="who">Ethan Rapoport</p>
    <p>GE1501 Cornerstone of Engineering 1, Fall 2026</p>
  </div>
</footer>
<script>
(function(){
  var btn=document.querySelector('.menu-btn'),menu=document.getElementById('site-menu');
  function set(open){btn.setAttribute('aria-expanded',open);menu.hidden=!open;btn.setAttribute('aria-label',open?'Close menu':'Open menu');}
  btn.addEventListener('click',function(e){e.stopPropagation();set(menu.hidden);});
  menu.addEventListener('click',function(e){if(e.target.closest('a'))set(false);});
  document.addEventListener('click',function(e){if(!menu.hidden&&!menu.contains(e.target))set(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!menu.hidden){set(false);btn.focus();}});
})();
</script>
</body>
</html>
